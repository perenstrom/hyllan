# Docker's default json-file log driver doesn't rotate on its own, so every
# service below bounds it explicitly — a small, cheap guard against an
# unbounded log filling the VPS disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Builds the init script into the image (docker/postgres/Dockerfile)
    # instead of bind-mounting docker/postgres-init at runtime — keeps this
    # in sync with compose.coolify.yaml, where a host bind-mount's source
    # path isn't reliable on self-hosting platforms that manage their own
    # checkout location (see compose.coolify.yaml's db service for details).
    build:
      context: ./docker
      dockerfile: postgres/Dockerfile
    restart: unless-stopped
    # log_destination stays at its stderr default (captured by Docker's log
    # driver below, same as every other service); these two just turn on
    # slow-query and lock-contention visibility on top of that default.
    command:
      - postgres
      - -c
      - log_min_duration_statement=250
      - -c
      - log_lock_waits=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GOTRUE_DB_PASSWORD: ${GOTRUE_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - hyllan-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  auth:
    # Standalone GoTrue only — not the full Supabase bundle (Kong/PostgREST/
    # Storage/Realtime/Studio) — pointed at Hyllan's own Postgres, per
    # PER-213's decision (see PER-222's "Auth" implementation decision).
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${GOTRUE_API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${GOTRUE_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # No SMTP configured for local dev: skip email confirmation entirely
      # rather than have signups fail trying to send mail.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    ports:
      - "${GOTRUE_PORT}:9999"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # Production-only services, brought up with `--profile production` (or
  # COMPOSE_PROFILES=production) alongside db/auth above — see README's
  # "Production deployment" section. Local dev runs the app on the host via
  # `npm run dev` instead, so plain `docker compose up -d` is unaffected.
  app:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Must be a build arg, not a runtime env var — see Dockerfile.
        NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN:-}
        # next.config.ts's rewrites() needs this at build time — see
        # Dockerfile.
        GOTRUE_API_EXTERNAL_URL: ${GOTRUE_API_EXTERNAL_URL}
        # @supabase/ssr's client needs these at build time — see Dockerfile.
        # The app's own public origin, not GoTrue's (see .env.example).
        # ANON_KEY is never checked by standalone GoTrue — any non-empty
        # value works.
        NEXT_PUBLIC_SUPABASE_URL: https://${DOMAIN}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-unused-by-standalone-gotrue
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  proxy:
    profiles: ["production"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      auth:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - hyllan-caddy-data:/data
      - hyllan-caddy-config:/config
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:2019/config/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  backup:
    profiles: ["production"]
    build:
      context: ./docker/backup
    restart: unless-stopped
    # busybox crond calls setpgid on itself, which fails when it's PID 1
    # ("setpgid: Operation not permitted") — Docker's built-in init keeps
    # crond as a child process instead, avoiding that.
    init: true
    depends_on:
      db:
        condition: service_healthy
    # env_file passes through any RCLONE_CONFIG_<REMOTE>_* variables an
    # operator adds to .env for their chosen off-server target, without
    # compose.yaml needing to know the remote's name in advance.
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - hyllan-backups:/backups
    healthcheck:
      # crond alive, and (once backup.sh has run at least once) its last
      # successful run isn't more than two scheduled runs old — a missing
      # marker (nothing has run yet since deploy) counts as healthy, only a
      # stale one doesn't.
      test:
        [
          "CMD-SHELL",
          "pgrep crond && ! find /backups/.last-success -mmin +2880 2>/dev/null | grep -q .",
        ]
      interval: 30m
      timeout: 5s
      retries: 3
    logging: *default-logging

volumes:
  hyllan-db-data:
  hyllan-caddy-data:
  hyllan-caddy-config:
  hyllan-backups:
