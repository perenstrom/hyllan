name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Required status checks (build, e2e) must report on every commit, even
  # docs-only ones, or GitHub's branch protection waits forever for a check
  # that never runs (see PER-266 triage notes). So the workflow itself is no
  # longer skipped via paths-ignore — instead this job detects whether any
  # non-doc file changed, and build/e2e use its output to skip their actual
  # work (but still always report success) when nothing but docs changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"

  build:
    needs: changes
    runs-on: ubuntu-latest
    env:
      # `next build` evaluates route handler modules (incl. src/db/client.ts)
      # while collecting page data. The postgres.js driver only connects
      # lazily on first query, so a syntactically valid but unreachable URL
      # is enough — no real database is needed in CI for this build step.
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
      # next.config.ts's rewrite() reads this at build time to validate the
      # rewrite destination — it just needs to be a well-formed URL, not
      # reachable (no GoTrue container runs in this job).
      GOTRUE_API_EXTERNAL_URL: http://localhost:9999
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - if: needs.changes.outputs.code == 'true'
        run: npm ci
      - if: needs.changes.outputs.code == 'true'
        run: npm run lint
      - if: needs.changes.outputs.code == 'true'
        run: npm run typecheck
      - if: needs.changes.outputs.code == 'true'
        run: npm run test
      - if: needs.changes.outputs.code == 'true'
        run: npm run build

  e2e:
    needs: changes
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hyllan
      POSTGRES_DB: hyllan
      POSTGRES_PORT: 5432
      DATABASE_URL: postgres://postgres:hyllan@localhost:5432/hyllan
      GOTRUE_PORT: 9999
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_PASSWORD: supabase_auth_admin
      GOTRUE_JWT_SECRET: ci-only-secret-do-not-use-in-production
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-unused-by-standalone-gotrue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - if: needs.changes.outputs.code == 'true'
        run: npm ci
      - if: needs.changes.outputs.code == 'true'
        run: docker compose up -d --wait
      - if: needs.changes.outputs.code == 'true'
        run: npm run db:migrate
      - if: needs.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium
      - if: needs.changes.outputs.code == 'true'
        run: npm run test:e2e
      - if: always() && needs.changes.outputs.code == 'true'
        run: docker compose down

  deploy-staging:
    needs: [changes, build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Coolify staging deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_STAGING_APP_UUID: ${{ vars.COOLIFY_STAGING_APP_UUID }}
          COOLIFY_STAGING_TOKEN: ${{ secrets.COOLIFY_STAGING_TOKEN }}
        run: |
          http_code=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --request POST "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_STAGING_APP_UUID}&force=false" \
            --header "Authorization: Bearer ${COOLIFY_STAGING_TOKEN}")
          cat response.json
          if [ "$http_code" -ge 300 ]; then
            echo "::error::Coolify deploy-trigger request failed (HTTP $http_code)."
            exit 1
          fi
