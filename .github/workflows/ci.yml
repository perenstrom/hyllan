name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Required status checks (build, e2e) must report on every commit, even
  # docs-only ones, or GitHub's branch protection waits forever for a check
  # that never runs (see PER-266 triage notes). So the workflow itself is no
  # longer skipped via paths-ignore — instead this job detects whether any
  # non-doc file changed, and build/e2e use its output to skip their actual
  # work (but still always report success) when nothing but docs changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"

  build:
    needs: changes
    runs-on: ubuntu-latest
    env:
      # `next build` evaluates route handler modules (incl. src/db/client.ts)
      # while collecting page data. The postgres.js driver only connects
      # lazily on first query, so a syntactically valid but unreachable URL
      # is enough — no real database is needed in CI for this build step.
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
      # next.config.ts's rewrite() reads this at build time to validate the
      # rewrite destination — it just needs to be a well-formed URL, not
      # reachable (no GoTrue container runs in this job).
      GOTRUE_API_EXTERNAL_URL: http://localhost:9999
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - if: needs.changes.outputs.code == 'true'
        run: npm ci
      - if: needs.changes.outputs.code == 'true'
        run: npm run lint
      - if: needs.changes.outputs.code == 'true'
        run: npm run typecheck
      - if: needs.changes.outputs.code == 'true'
        run: npm run test
      - if: needs.changes.outputs.code == 'true'
        run: npm run build

  e2e:
    needs: changes
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hyllan
      POSTGRES_DB: hyllan
      POSTGRES_PORT: 5432
      DATABASE_URL: postgres://postgres:hyllan@localhost:5432/hyllan
      GOTRUE_PORT: 9999
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_PASSWORD: supabase_auth_admin
      GOTRUE_JWT_SECRET: ci-only-secret-do-not-use-in-production
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-unused-by-standalone-gotrue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - if: needs.changes.outputs.code == 'true'
        run: npm ci
      - if: needs.changes.outputs.code == 'true'
        run: docker compose up -d --wait
      - if: needs.changes.outputs.code == 'true'
        run: npm run db:migrate
      - if: needs.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium
      - if: needs.changes.outputs.code == 'true'
        run: npm run test:e2e
      - if: always() && needs.changes.outputs.code == 'true'
        run: docker compose down

  # Full-catalog screenshot sweep (PER-262), PR review only — not a required
  # check and not run on pushes to main, so it's skipped there via the job
  # `if` rather than the changes-gated-steps pattern build/e2e use (those
  # two must report on every commit for branch protection; this one has no
  # such requirement). `npm run screenshots` is self-contained: it brings up
  # the Docker stack, migrates, seeds each scenario's own data, and captures
  # every scenario at both viewports.
  screenshots:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list-files.outputs.files }}
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hyllan
      POSTGRES_DB: hyllan
      POSTGRES_PORT: 5432
      DATABASE_URL: postgres://postgres:hyllan@localhost:5432/hyllan
      GOTRUE_PORT: 9999
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_PASSWORD: supabase_auth_admin
      GOTRUE_JWT_SECRET: ci-only-secret-do-not-use-in-production
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-unused-by-standalone-gotrue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - if: needs.changes.outputs.code == 'true'
        run: npm ci
      - if: needs.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium
      - if: needs.changes.outputs.code == 'true'
        run: npm run screenshots
      # One row per image in the run's Artifacts list, so a reviewer opens a
      # PNG directly instead of downloading a zip (below). The catalog is
      # read from whatever files capture actually produced, not from
      # scenarios.ts, so adding a scenario there never needs a matching
      # change here.
      - if: needs.changes.outputs.code == 'true'
        id: list-files
        run: echo "files=$(ls screenshots/output | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
      # Also uploaded as one zip (below the per-image artifacts in the same
      # list) for anyone who'd rather grab every image in one download.
      - if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-all
          path: screenshots/output
          retention-days: 2
          if-no-files-found: error
      - if: always() && needs.changes.outputs.code == 'true'
        run: docker compose down

  # Re-uploads each image from the screenshots job's zip bundle as its own
  # unzipped artifact (actions/upload-artifact@v7's `archive: false`, GitHub
  # Changelog 2026-02-26) — a reviewer can open a PNG straight from the
  # run's Artifacts list instead of downloading and unzipping a bundle.
  # archive: false only accepts one file per step, so this fans out over
  # the dynamic file list via a matrix rather than a fixed, hand-maintained
  # step per scenario.
  publish-screenshots:
    needs: [changes, screenshots]
    if: success() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.screenshots.outputs.files) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenshots-all
          path: screenshots/output
      - uses: actions/upload-artifact@v7
        with:
          path: screenshots/output/${{ matrix.file }}
          archive: false
          retention-days: 2

  # Posts (or updates) a PR comment linking to each scenario's artifacts.
  # An artifact's URL requires GitHub auth to open, so a plain markdown
  # image tag pointing at one won't render for a reviewer — GitHub has no
  # supported way to upload an image that does render inline in a comment
  # from a workflow. A clickable link per scenario is the honest middle
  # ground: one click to view instead of a download-and-unzip round trip,
  # with no new or undocumented infrastructure.
  comment-screenshots:
    needs: [changes, screenshots, publish-screenshots]
    if: success() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });

            const scenarios = new Map();
            for (const artifact of artifacts) {
              const match = artifact.name.match(/^(.+)-(desktop|mobile)\.png$/);
              if (!match) continue;
              const [, scenario, viewport] = match;
              const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
              if (!scenarios.has(scenario)) scenarios.set(scenario, {});
              scenarios.get(scenario)[viewport] = url;
            }

            const marker = "<!-- per-262-screenshots-comment -->";
            const rows = [...scenarios.entries()]
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([scenario, { desktop, mobile }]) =>
                `| ${scenario} | ${desktop ? `[View](${desktop})` : "—"} | ${mobile ? `[View](${mobile})` : "—"} |`,
              );

            const body = [
              "## Screenshots",
              "",
              "| Scenario | Desktop | Mobile |",
              "| --- | --- | --- |",
              ...rows,
              "",
              marker,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy-staging:
    needs: [changes, build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Coolify staging deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_STAGING_APP_UUID: ${{ vars.COOLIFY_STAGING_APP_UUID }}
          COOLIFY_STAGING_TOKEN: ${{ secrets.COOLIFY_STAGING_TOKEN }}
        run: |
          http_code=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --request POST "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_STAGING_APP_UUID}&force=false" \
            --header "Authorization: Bearer ${COOLIFY_STAGING_TOKEN}")
          cat response.json
          if [ "$http_code" -ge 300 ]; then
            echo "::error::Coolify deploy-trigger request failed (HTTP $http_code)."
            exit 1
          fi
